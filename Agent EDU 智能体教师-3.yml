app:
  description: Agent EDU 平台的 AI 智能体教师，专注于 Agent 智能体开发教学，涵盖 Dify、Coze、LangChain 等平台，以及
    Python、Prompt Engineering、API 开发等技术栈。支持文件上传和内容解析。
  icon: 🤖
  icon_background: '#E0F2FE'
  mode: advanced-chat
  name: Agent EDU 智能体教师
  use_icon_as_answer_icon: true
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/tongyi:0.1.18@a214145a5793380db3c576f5460b50a9086cdf5a84089e1897f8c8196b20d816
    version: null
kind: app
version: 0.5.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      - .PDF
      - .MD
      - .TXT
      - .PY
      - .JS
      - .TS
      - .JSON
      allowed_file_types:
      - document
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: '👋 你好！我是 Agent EDU 的 AI 智能体教师。


      我可以帮助你学习：

      🤖 **Agent 智能体开发** - Dify、Coze、LangChain、AutoGPT 等平台

      💻 **技术栈知识** - Python、API 开发、Prompt Engineering、向量数据库等

      📚 **学习路径规划** - 根据你的基础推荐合适的课程和项目


      📎 **支持文件上传** - 你可以上传代码文件、文档让我帮你分析


      有什么想学习或了解的，尽管问我吧！'
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 如何从零开始学习 Agent 智能体开发？
    - Prompt Engineering 有哪些最佳实践？
    - 帮我分析一下上传的代码文件
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    # 开始 -> 文档提取器
    - data:
        sourceType: start
        targetType: document-extractor
      id: start-to-doc-extractor
      source: start_node
      sourceHandle: source
      target: doc_extractor
      targetHandle: target
      type: custom
    # 文档提取器 -> 问题分类器
    - data:
        sourceType: document-extractor
        targetType: question-classifier
      id: doc-extractor-to-classifier
      source: doc_extractor
      sourceHandle: source
      target: question_classifier
      targetHandle: target
      type: custom
    # 问题分类器 -> 各知识库
    - data:
        sourceType: question-classifier
        targetType: knowledge-retrieval
      id: classifier-to-agent-kb
      source: question_classifier
      sourceHandle: class_agent_dev
      target: kb_agent_dev
      targetHandle: target
      type: custom
    - data:
        sourceType: question-classifier
        targetType: knowledge-retrieval
      id: classifier-to-tech-kb
      source: question_classifier
      sourceHandle: class_tech_stack
      target: kb_tech_stack
      targetHandle: target
      type: custom
    - data:
        sourceType: question-classifier
        targetType: knowledge-retrieval
      id: classifier-to-learning-kb
      source: question_classifier
      sourceHandle: class_learning_path
      target: kb_learning_path
      targetHandle: target
      type: custom
    - data:
        sourceType: question-classifier
        targetType: llm
      id: classifier-to-general-llm
      source: question_classifier
      sourceHandle: class_general
      target: llm_general
      targetHandle: target
      type: custom
    # 知识库 -> LLM
    - data:
        sourceType: knowledge-retrieval
        targetType: llm
      id: agent-kb-to-llm
      source: kb_agent_dev
      sourceHandle: source
      target: llm_agent_dev
      targetHandle: target
      type: custom
    - data:
        sourceType: knowledge-retrieval
        targetType: llm
      id: tech-kb-to-llm
      source: kb_tech_stack
      sourceHandle: source
      target: llm_tech_stack
      targetHandle: target
      type: custom
    - data:
        sourceType: knowledge-retrieval
        targetType: llm
      id: learning-kb-to-llm
      source: kb_learning_path
      sourceHandle: source
      target: llm_learning_path
      targetHandle: target
      type: custom
    # LLM -> Answer
    - data:
        sourceType: llm
        targetType: answer
      id: llm-agent-to-answer
      source: llm_agent_dev
      sourceHandle: source
      target: answer_agent_dev
      targetHandle: target
      type: custom
    - data:
