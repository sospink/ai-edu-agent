      sourceHandle: source
      target: answer_learning_path
      targetHandle: target
      type: custom
    - data:
        sourceType: llm
        targetType: answer
      id: llm-general-to-answer
      source: llm_general
      sourceHandle: source
      target: answer_general
      targetHandle: target
      type: custom
