root = "."
tmp_dir = "tmp/air"

[build]
cmd = "go build -o ./tmp/air/server ./cmd/server"
bin = "./tmp/air/server"
full_bin = "DATABASE_AUTO_MIGRATE=true ./tmp/air/server"
include_ext = ["go", "yaml", "yml", "env"]
include_file = [".env", "configs/app.yaml"]
exclude_dir = ["tmp", "vendor", "logs", "bin", ".git"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true
