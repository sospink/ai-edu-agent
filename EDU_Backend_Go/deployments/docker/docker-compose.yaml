version: "3.9"

services:
  backend-go:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    ports:
      - "4002:4002"
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DATABASE_NAME: edu_db
      REDIS_ENABLED: "true"
      REDIS_ADDR: redis:6379
      JWT_SECRET: change-me
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: edu_db
    ports:
      - "3307:3306"

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
