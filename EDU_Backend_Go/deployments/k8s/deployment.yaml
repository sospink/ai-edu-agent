apiVersion: apps/v1
kind: Deployment
metadata:
  name: edu-backend-go
  namespace: edu-backend-go-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edu-backend-go
  template:
    metadata:
      labels:
        app: edu-backend-go
    spec:
      serviceAccountName: edu-backend-go
      containers:
        - name: backend
          image: edu-backend-go:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4002
          envFrom:
            - configMapRef:
                name: edu-backend-go-config
            - secretRef:
                name: edu-backend-go-secret
