apiVersion: v1
kind: ServiceAccount
metadata:
  name: edu-backend-go
  namespace: edu-backend-go-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: edu-backend-go
  namespace: edu-backend-go-dev
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edu-backend-go
  namespace: edu-backend-go-dev
subjects:
  - kind: ServiceAccount
    name: edu-backend-go
    namespace: edu-backend-go-dev
roleRef:
  kind: Role
  name: edu-backend-go
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: edu-backend-go-runtime
  namespace: edu-runtime-dev
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edu-backend-go-runtime
  namespace: edu-runtime-dev
subjects:
  - kind: ServiceAccount
    name: edu-backend-go
    namespace: edu-backend-go-dev
roleRef:
  kind: Role
  name: edu-backend-go-runtime
  apiGroup: rbac.authorization.k8s.io
