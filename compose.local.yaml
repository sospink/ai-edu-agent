name: agent-edu-local

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_DB_PASSWORD:?请先运行 bash scripts/local-dev.sh init}
      MYSQL_DATABASE: edu_local
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h 127.0.0.1 -uroot -e 'SELECT 1' edu_local"]
      interval: 5s
      timeout: 5s
      retries: 40

  backend:
    build:
      context: .
      dockerfile: deploy/local/backend.Dockerfile
    environment:
      APP_ENV: development
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 4000
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: ${LOCAL_DB_PASSWORD:?请先初始化本地配置}
      DATABASE_NAME: edu_local
      DATABASE_AUTO_MIGRATE: "true"
      JWT_SECRET: ${LOCAL_JWT_SECRET:?请先初始化本地配置}
      DEFAULT_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?请先初始化本地配置}
      REDIS_ENABLED: "false"
      K8S_ENABLED: "false"
      DOCKER_HOST: 127.0.0.1
      COURSE_HARNESS_IMAGE: ""
      UPLOAD_ROOT: /app/public/uploads
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:${LOCAL_API_PORT:-4000}:4000"
    volumes:
      - backend-data:/app/public
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: deploy/local/frontend.Dockerfile
    environment:
      VITE_API_BASE_URL: /api
      VITE_DEV_API_TARGET: http://backend:4000
    ports:
      - "127.0.0.1:${LOCAL_WEB_PORT:-3000}:3000"
    volumes:
      - ./EDU_Frontend/src:/app/src:ro
      - ./EDU_Frontend/public:/app/public:ro
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r = await fetch('http://127.0.0.1:3000/api/health'); if (!r.ok) process.exit(1)"]
      interval: 5s
      timeout: 5s
      retries: 48
    depends_on:
      - backend

volumes:
  mysql-data:
  backend-data:
