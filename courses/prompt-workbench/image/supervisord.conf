[supervisord]
user=root
nodaemon=true
logfile=/var/log/course/supervisord.log
pidfile=/tmp/course-supervisord.pid

[unix_http_server]
file=/tmp/course-supervisor.sock
chmod=0700
chown=student:student

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/course-supervisor.sock

[program:desktop-display]
command=/usr/bin/Xtigervnc :1 -geometry 1440x900 -depth 24 -SecurityTypes None -localhost yes -rfbport 5901
user=student
priority=10
autorestart=true
stdout_logfile=/var/log/course/vnc.log
stderr_logfile=/var/log/course/vnc-error.log
environment=HOME="/home/student",USER="student",DISPLAY=":1"

[program:desktop-session]
command=/usr/local/bin/course-desktop
user=student
priority=20
autorestart=true
stdout_logfile=/var/log/course/desktop.log
stderr_logfile=/var/log/course/desktop-error.log
environment=HOME="/home/student",USER="student",DISPLAY=":1",XDG_RUNTIME_DIR="/tmp/runtime-student"

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 0.0.0.0:6080 localhost:5901
user=student
priority=30
autorestart=true
stdout_logfile=/var/log/course/novnc.log
stderr_logfile=/var/log/course/novnc-error.log

[program:workbench]
command=/opt/venvs/prompt-workbench/bin/python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers
directory=/workspace/prompt-workbench
user=student
priority=40
autorestart=true
stdout_logfile=/var/log/course/workbench.log
stderr_logfile=/var/log/course/workbench-error.log
environment=HOME="/home/student",USER="student",PYTHONDONTWRITEBYTECODE="1"
