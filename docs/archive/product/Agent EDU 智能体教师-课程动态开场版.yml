app:
  description: Agent EDU 平台的 AI 智能体教师，基于 5 门理论课程授课（提示词工程、MCPServer开发、ADE配置与智能体开发、智能体框架与开发、安全与合规），支持学习路径规划与文件解析。
  icon: 🤖
  icon_background: '#E0F2FE'
  mode: advanced-chat
  name: Agent EDU 智能体教师
  use_icon_as_answer_icon: true
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/tongyi:0.1.19@12ddda76bb473f9beb52d2ea2a67412d54924f93a29465fffb8635ba62b409c3
    version: null
kind: app
version: 0.5.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      - .PDF
      - .MD
      - .TXT
      - .PY
      - .JS
      - .TS
      - .JSON
      allowed_file_types:
      - document
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: '👋 你好！我是 Agent EDU 的 AI 智能体教师。


      你当前正在学习：
      课程：{{course_title}}
      技能：{{skill_name}}
      课时：{{lesson_name}}


      我会结合这门课的课程介绍给你做开场引导和学习建议。

      📎 支持文件上传：你可以上传代码或文档让我分析。'
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 请先基于课程介绍，概览一下《{{course_title}}》和“{{lesson_name}}”的学习目标
    - 基于“{{skill_name}}”，给我一个从入门到实操的学习顺序
    - 结合课程简介，告诉我这一课的常见误区和练习建议
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
